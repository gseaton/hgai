<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="HypergraphAI component layers">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #1f2937; }
    .t { font-size: 15px; font-weight: 600; }
    .s { font-size: 12px; fill: #4b5563; }
  </style>
  <rect x="10" y="10" width="620" height="60" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="320" y="36" text-anchor="middle" class="t">Web UI · hgsh Shell · AI Chat · External AI agents</text>
  <text x="320" y="56" text-anchor="middle" class="s">people and agents</text>

  <rect x="10" y="84" width="300" height="60" rx="8" fill="#dcfce7" stroke="#22c55e"/>
  <text x="160" y="110" text-anchor="middle" class="t">REST API</text>
  <text x="160" y="130" text-anchor="middle" class="s">FastAPI · /api/v1</text>
  <rect x="330" y="84" width="300" height="60" rx="8" fill="#dcfce7" stroke="#22c55e"/>
  <text x="480" y="110" text-anchor="middle" class="t">MCP Server</text>
  <text x="480" y="130" text-anchor="middle" class="s">FastMCP · hgai_* tools</text>

  <rect x="10" y="158" width="620" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="320" y="184" text-anchor="middle" class="t">Core Engine</text>
  <text x="320" y="204" text-anchor="middle" class="s">SHQL query · inference · auth · cache · temporal · meshes</text>

  <rect x="10" y="232" width="620" height="58" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="320" y="258" text-anchor="middle" class="t">Pluggable storage — MongoDB (Motor, async)</text>
  <text x="320" y="278" text-anchor="middle" class="s">hypergraphs · hypernodes · hyperedges · notes · media · accounts</text>
</svg>
